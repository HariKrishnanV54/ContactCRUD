<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center text-primary mb-4">CONTACT MANAGER</h1>

        <!-- Form Section -->
        <form id="contactForm">
            <div class="row g-3">
                <input type="text" id="editStatus" hidden>
                <div class="col-lg-3">
                    <input id="name" type="text" placeholder="Enter name" class="form-control">
                </div>
                <div class="col-lg-3">
                    <input id="phone" type="text" placeholder="Enter phone" class="form-control">
                </div>
                <div class="col-lg-3">
                    <input id="email" type="email" placeholder="Enter email" class="form-control">
                </div>
                <div class="col-lg-3">
                    <button type="submit" class="btn btn-success w-100">SAVE</button>
                </div>
            </div>
        </form>

        <!-- Search Bar -->
        <div class="row my-4">
            <div class="col-12">
                <input type="text" id="search" placeholder="Search by name..." class="form-control">
            </div>
        </div>

        <!-- Table Section -->
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tablebody">
                <!-- Static UI Demo Rows -->
                <tr>
                    <td>1</td>
                    <td>Alice Walker</td>
                    <td>+1 202-555-0143</td>
                    <td>alice@example.com</td>
                    <td>
                        <button class="btn btn-info btn-sm text-white">View</button>
                        <button class="btn btn-warning btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Bob Roberts</td>
                    <td>+1 312-555-0182</td>
                    <td>bob@example.com</td>
                    <td>
                        <button class="btn btn-info btn-sm text-white">View</button>
                        <button class="btn btn-warning btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="./main.js"></script>
</body>

</html>
